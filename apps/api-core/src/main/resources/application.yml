spring:
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 2000
  datasource:
    url: jdbc:postgresql://localhost:5432/construction
    username: app
    password: app
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
server:
  port: 8080
app:
  aiImportServiceBaseUrl: http://localhost:8000
