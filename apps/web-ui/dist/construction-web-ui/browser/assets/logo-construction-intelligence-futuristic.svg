<?xml version="1.0" encoding="UTF-8"?>
<!-- Futuristic logo for Construction Intelligence: neon/glow, circuit globe + skyline + robotic eye -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" preserveAspectRatio="xMidYMid meet">
  <title>Construction Intelligence - Futuristic Logo</title>
  <desc>Glowing circuit globe with skyline and robotic eye, modern sans wordmark "Construction" and neon "INTELLIGENCE" tagline.</desc>
  <defs>
    <linearGradient id="neonBlue" x1="0" x2="1">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0" x2="1">
      <stop offset="0%" stop-color="#6ef6ff"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>
    <linearGradient id="neonOrange" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffb86b"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="innerGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="g" />
      <feComposite in="SourceGraphic" in2="g" operator="over" />
    </filter>

    <mask id="circleMask">
      <rect width="100%" height="100%" fill="black" />
      <circle cx="180" cy="180" r="120" fill="white" />
    </mask>

    <style><![CDATA[
      .word { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; font-weight: 800; fill: #e6eefc; }
      .tag  { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; font-weight: 700; fill: url(#neonOrange); letter-spacing: 6px; }
    ]]></style>
  </defs>

  <!-- dark transparent background (keeps file flexible) -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Left: glowing circuit globe -->
  <g transform="translate(80,30)">
    <!-- outer halo -->
    <circle cx="180" cy="180" r="140" fill="none" stroke="url(#neonBlue)" stroke-width="10" opacity="0.12" filter="url(#glow)" />

    <!-- base disc with subtle grid -->
    <g mask="url(#circleMask)">
      <radialGradient id="discGrad" cx="50%" cy="40%">
        <stop offset="0%" stop-color="#0b1220" />
        <stop offset="70%" stop-color="#021226" />
        <stop offset="100%" stop-color="#000814" />
      </radialGradient>
      <circle cx="180" cy="180" r="120" fill="url(#discGrad)" />

      <!-- inner circuitry: concentric rings -->
      <g stroke="#00e6ff" stroke-opacity="0.14" stroke-width="1" fill="none">
        <circle cx="180" cy="180" r="18" />
        <circle cx="180" cy="180" r="36" />
        <circle cx="180" cy="180" r="60" />
        <circle cx="180" cy="180" r="90" />
      </g>

      <!-- skyline silhouette (futuristic towers) -->
      <g transform="translate(0,10)" fill="url(#neonCyan)" opacity="0.98" filter="url(#innerGlow)">
        <path d="M95 200 L95 120 L110 120 L110 90 L140 90 L140 120 L160 120 L160 70 L190 70 L190 120 L220 120 L220 150 L240 150 L240 200 Z"/>
        <!-- fine neon highlights on towers -->
        <path d="M100 118 L100 140" stroke="#bff1ff" stroke-width="2" stroke-linecap="round" />
        <path d="M150 68 L150 95" stroke="#a4f0ff" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- circuit traces connecting skyline to rim -->
      <g stroke="#4be0ff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.95">
        <path d="M140 200 L140 160 L120 146 L100 138" stroke-opacity="0.9" />
        <path d="M180 200 L180 140 L200 130 L220 120" stroke-opacity="0.9" />
        <path d="M200 160 L220 140 L250 120" stroke-opacity="0.7" />
      </g>

      <!-- robotic eye / sensor at right side -->
      <g transform="translate(260,140)">
        <circle cx="0" cy="0" r="26" fill="#001522" stroke="#00d2ff" stroke-width="3" filter="url(#glow)" />
        <circle cx="0" cy="0" r="14" fill="#00d2ff" opacity="0.96" />
        <circle cx="0" cy="0" r="6" fill="#ffffff" opacity="0.9" />
        <path d="M-12 -6 L6 4" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" opacity="0.9" />
      </g>

      <!-- small floating nodes (neural) -->
      <g>
        <circle cx="240" cy="80" r="4" fill="#7ef6ff" opacity="0.95" />
        <circle cx="100" cy="60" r="3" fill="#ffa94d" opacity="0.9" />
        <circle cx="50" cy="150" r="3" fill="#a78bfa" opacity="0.9" />
      </g>

    </g>

    <!-- halo glow strokes for extra futurism -->
    <g>
      <path d="M40 180 C70 120, 290 80, 320 160" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.08" fill="none" />
      <path d="M20 220 C100 260, 260 260, 340 220" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-opacity="0.06" fill="none" />
    </g>

  </g>

  <!-- Right: wordmark -->
  <g transform="translate(420,120)">
    <text class="word" x="0" y="40" font-size="64">Construction</text>
    <text class="tag" x="0" y="96" font-size="28">INTELLIGENCE</text>

    <!-- small neon underline near tag -->
    <rect x="220" y="80" width="160" height="6" rx="3" fill="url(#neonBlue)" opacity="0.9" filter="url(#glow)" />

    <!-- accent: thin circuit line linking to globe -->
    <path d="M-260 180 L-40 180" stroke="#00b7ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.6" />
  </g>

  <!-- subtle reflection line across whole logo for premium feel -->
  <path d="M0 44 C120 10, 360 10, 600 44" stroke="#ffffff" stroke-opacity="0.03" stroke-width="18" fill="none" />

</svg>
