<?xml version="1.0" encoding="UTF-8"?>
<!-- Construction Intelligence logo: premium glass + AI monogram -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="lg1" x1="0" x2="1">
      <stop offset="0%" stop-color="#0ea5a4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glass1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="mRound">
      <rect x="0" y="0" width="120" height="120" rx="20" ry="20" fill="white" />
    </mask>
    <style type="text/css"><![CDATA[
      .brand { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; font-weight: 700; letter-spacing: -0.02em; }
      .name { font-size: 34px; fill: #06152b; }
      .tag { font-size: 14px; fill: #475569; font-weight: 600; }
    ]]></style>
  </defs>

  <!-- Background transparent so it works on any canvas -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Monogram block (left) -->
  <g transform="translate(24,20)">
    <!-- rounded tile -->
    <rect x="0" y="0" width="120" height="120" rx="20" ry="20" fill="url(#lg1)" opacity="0.95" />
    <!-- glass shine -->
    <rect x="0" y="0" width="120" height="120" rx="20" ry="20" fill="url(#glass1)" opacity="0.5" />
    <!-- inner subtle outline -->
    <rect x="6" y="6" width="108" height="108" rx="16" ry="16" fill="none" stroke="#ffffff" stroke-opacity="0.06" />

    <!-- stylized C (concrete / arc) -->
    <path d="M38 36 C26 36, 22 58, 22 72 C22 94, 40 110, 62 110" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" transform="translate(0,-6)" />

    <!-- stylized I as a column with AI nodes -->
    <g transform="translate(80,18)">
      <rect x="-6" y="6" width="18" height="84" rx="4" ry="4" fill="#ffffff" opacity="0.95" />
      <!-- neural nodes along column -->
      <circle cx="3" cy="28" r="5" fill="#fde68a" />
      <circle cx="3" cy="52" r="5" fill="#93c5fd" />
      <circle cx="3" cy="76" r="5" fill="#34d399" />
      <path d="M3 28 L30 12" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.95" />
      <path d="M3 52 L34 46" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.95" />
      <path d="M3 76 L26 96" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.95" />
    </g>

    <!-- micro-chip accent at corner -->
    <g transform="translate(10,86)">
      <rect x="0" y="0" width="18" height="18" rx="3" fill="#06152b" opacity="0.5" />
      <rect x="2" y="2" width="14" height="14" rx="2" fill="#7dd3fc" opacity="0.85" filter="url(#softGlow)" />
    </g>
  </g>

  <!-- Brand name -->
  <g transform="translate(168,52)">
    <text class="brand name">Construction Intelligence</text>
    <text class="brand tag" x="0" y="34">AI-powered construction insights</text>
  </g>

</svg>
