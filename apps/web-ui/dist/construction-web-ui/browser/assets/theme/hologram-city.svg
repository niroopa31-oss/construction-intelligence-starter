<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 420) rotate(90) scale(260 360)">
      <stop stop-color="#1AD6FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1AD6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#5CE7FF"/>
      <stop offset="1" stop-color="#0D56FF"/>
    </linearGradient>
    <linearGradient id="crane" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFB347"/>
      <stop offset="1" stop-color="#FF8B00"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#03091A"/>
  <circle cx="600" cy="420" r="240" fill="url(#bgGlow)"/>

  <g opacity="0.35" stroke="#1AD6FF">
    <path d="M160 620H1040"/>
    <path d="M220 670H980"/>
    <path d="M280 710H920"/>
  </g>

  <g filter="url(#softGlow)">
    <rect x="360" y="300" width="60" height="220" rx="6" fill="url(#tower)"/>
    <rect x="440" y="220" width="90" height="300" rx="6" fill="url(#tower)"/>
    <rect x="560" y="170" width="100" height="350" rx="6" fill="url(#tower)"/>
    <rect x="690" y="250" width="70" height="270" rx="6" fill="url(#tower)"/>
    <rect x="790" y="320" width="50" height="200" rx="6" fill="url(#tower)"/>
  </g>

  <g opacity="0.7" stroke="#D6F6FF" stroke-width="4">
    <path d="M390 330V500"/>
    <path d="M470 250V500"/>
    <path d="M605 190V500"/>
    <path d="M725 280V500"/>
  </g>

  <g filter="url(#softGlow)">
    <path d="M250 280L360 230" stroke="url(#crane)" stroke-width="10" stroke-linecap="round"/>
    <path d="M275 285V465" stroke="url(#crane)" stroke-width="10" stroke-linecap="round"/>
    <path d="M250 320H330" stroke="url(#crane)" stroke-width="8" stroke-linecap="round"/>
    <path d="M320 230L255 230" stroke="url(#crane)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g opacity="0.9" stroke="#1AD6FF" stroke-width="3" filter="url(#softGlow)">
    <path d="M600 520V650"/>
    <path d="M600 650H520"/>
    <path d="M600 650H690"/>
    <path d="M550 590H430"/>
    <path d="M650 590H790"/>
    <path d="M470 590V545"/>
    <path d="M745 590V545"/>
    <path d="M520 650V710"/>
    <path d="M690 650V710"/>
    <circle cx="430" cy="590" r="7" fill="#DFFBFF"/>
    <circle cx="790" cy="590" r="7" fill="#DFFBFF"/>
    <circle cx="520" cy="710" r="7" fill="#DFFBFF"/>
    <circle cx="690" cy="710" r="7" fill="#DFFBFF"/>
    <circle cx="470" cy="545" r="7" fill="#DFFBFF"/>
    <circle cx="745" cy="545" r="7" fill="#DFFBFF"/>
  </g>

  <ellipse cx="600" cy="735" rx="180" ry="26" fill="#0A2958" opacity="0.5"/>
  <ellipse cx="600" cy="735" rx="140" ry="16" stroke="#1AD6FF" stroke-opacity="0.55" stroke-width="4"/>
</svg>
