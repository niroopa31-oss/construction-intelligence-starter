<?xml version="1.0" encoding="UTF-8"?>
<!-- Premium glass-effect AI project cover for Construction Intelligence -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="1"/>
      <stop offset="60%" stop-color="#071135" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05203a" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="spark" cx="30%" cy="20%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="30" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="icon-brain">
      <!-- stylized neural brain / chip hybrid -->
      <rect x="-42" y="-30" width="84" height="60" rx="12" ry="12" fill="#071135" opacity="0.0" />
      <g transform="translate(-0,-0)">
        <circle cx="-22" cy="-6" r="6" fill="#7dd3fc" />
        <circle cx="-6" cy="-18" r="6" fill="#60a5fa" />
        <circle cx="10" cy="-6" r="6" fill="#a78bfa" />
        <circle cx="-2" cy="12" r="6" fill="#34d399" />
        <path d="M-22,-6 L-6,-18" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
        <path d="M-6,-18 L10,-6" stroke="#9f7aea" stroke-width="2" stroke-linecap="round"/>
        <path d="M10,-6 L-2,12" stroke="#86efac" stroke-width="2" stroke-linecap="round"/>
        <path d="M-2,12 L-22,-6" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
        <rect x="-26" y="-28" width="52" height="56" rx="10" fill="none" stroke="#06b6d4" stroke-opacity="0.15"/>
      </g>
    </g>

    <g id="icon-network">
      <g stroke="#7dd3fc" stroke-width="2" fill="#0ea5a4">
        <circle cx="0" cy="-18" r="6" fill="#7dd3fc" />
        <circle cx="16" cy="0" r="6" fill="#60a5fa" />
        <circle cx="-16" cy="0" r="6" fill="#a78bfa" />
        <circle cx="0" cy="18" r="6" fill="#34d399" />
        <path d="M0,-12 L12,-2" stroke="#93c5fd"/>
        <path d="M0,-12 L-12,-2" stroke="#93c5fd"/>
        <path d="M12,-2 L0,12" stroke="#93c5fd"/>
        <path d="M-12,-2 L0,12" stroke="#93c5fd"/>
      </g>
    </g>

  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- soft decorative spark -->
  <circle cx="300" cy="120" r="220" fill="url(#spark)" filter="url(#glow)" />

  <!-- glass card -->
  <g transform="translate(80,70)">
    <rect x="0" y="0" width="1440" height="760" rx="22" ry="22" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" />
    <rect x="8" y="8" width="1424" height="736" rx="18" ry="18" fill="url(#glass)" opacity="0.8" filter="url(#softShadow)" />

    <!-- subtle frosted lines -->
    <g opacity="0.06" fill="#ffffff">
      <rect x="28" y="28" width="200" height="6" rx="3" />
      <rect x="28" y="46" width="320" height="6" rx="3" />
      <rect x="1028" y="28" width="360" height="6" rx="3" />
    </g>

    <!-- Header area -->
    <g transform="translate(44,40)">
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="1060" height="170" rx="14" fill="rgba(255,255,255,0.02)" />
        <!-- left: title -->
        <text x="28" y="52" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto" font-size="28" fill="#e6eef6" font-weight="700">Construction Intelligence</text>
        <text x="28" y="88" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto" font-size="18" fill="#cfe8ff">AI Project — Project Summary</text>

        <!-- right: project name label box -->
        <rect x="860" y="18" width="160" height="46" rx="10" fill="#0b1220" opacity="0.55" />
        <text x="940" y="48" font-family="Inter, sans-serif" font-size="14" fill="#7dd3fc" text-anchor="middle">VAMSIRAM-NEWMARK</text>

        <!-- small AI badge -->
        <g transform="translate(960,100)">
          <rect x="0" y="0" width="180" height="40" rx="8" fill="#071135" opacity="0.45" stroke="#7dd3fc" stroke-opacity="0.08" />
          <use href="#icon-brain" transform="translate(18,20) scale(0.9)" />
          <text x="60" y="26" font-family="Inter, sans-serif" font-size="12" fill="#bdeafe">Autonomous Insights · AI</text>
        </g>

      </g>

      <!-- content area with icons and hero visuals -->
      <g transform="translate(0,200)">
        <!-- left hero panel -->
        <rect x="0" y="0" width="740" height="420" rx="12" fill="rgba(255,255,255,0.02)" />
        <!-- holographic grid -->
        <g transform="translate(28,22)" opacity="0.85">
          <!-- network icon large -->
          <g transform="translate(140,130) scale(2.4)">
            <use href="#icon-network" />
          </g>

          <!-- faint node grid -->
          <g stroke="#7dd3fc" stroke-opacity="0.06">
            <path d="M0,260 L680,260" />
            <path d="M0,0 L680,0" />
            <path d="M0,80 L680,80" />
            <path d="M0,160 L680,160" />
          </g>
        </g>

        <!-- right summary quick stats box -->
        <g transform="translate(780,0)">
          <rect x="0" y="0" width="360" height="220" rx="12" fill="rgba(255,255,255,0.02)" stroke-opacity="0.02" />
          <text x="22" y="36" font-family="Inter, sans-serif" font-size="22" fill="#e6eef6" font-weight="700">Project Metrics</text>
          <text x="22" y="72" font-family="Inter, sans-serif" font-size="14" fill="#93c5fd">Total Tasks</text>
          <text x="22" y="102" font-family="Inter, sans-serif" font-size="28" fill="#7dd3fc" font-weight="700">6431</text>

          <text x="22" y="150" font-family="Inter, sans-serif" font-size="14" fill="#93c5fd">Progress</text>
          <text x="22" y="180" font-family="Inter, sans-serif" font-size="28" fill="#ffd166" font-weight="700">0%</text>
        </g>

      </g>

    </g>

    <!-- footer decorative accents -->
    <g transform="translate(40,660)">
      <rect x="0" y="0" width="1360" height="36" rx="8" fill="rgba(255,255,255,0.02)" />
      <text x="18" y="24" font-family="Inter, sans-serif" font-size="13" fill="#9fbcd8">Generated by Construction Intelligence • AI-assisted project summary</text>
    </g>

  </g>

</svg>
