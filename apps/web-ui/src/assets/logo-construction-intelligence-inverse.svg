<?xml version="1.0" encoding="UTF-8"?>
<!-- Inverse (white-on-dark) variant for use on dark backgrounds -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="invBlue" x1="0" x2="1">
      <stop offset="0%" stop-color="#66f7ff"/>
      <stop offset="100%" stop-color="#b89cff"/>
    </linearGradient>
    <filter id="glo2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="none" />

  <g transform="translate(60,20)">
    <circle cx="180" cy="180" r="120" fill="#001220" stroke="url(#invBlue)" stroke-width="6" filter="url(#glo2)" />
    <g transform="translate(20,20)" fill="#ffffff">
      <path d="M80 200 L80 120 L96 120 L96 88 L124 88 L124 120 L146 120 L146 70 L178 70 L178 120 L210 120 L210 150 L234 150 L234 200 Z" opacity="0.95" />
    </g>
  </g>

  <g transform="translate(420,120)">
    <text x="0" y="40" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="64" fill="#ffffff">Construction</text>
    <text x="0" y="96" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="28" fill="url(#invBlue)">INTELLIGENCE</text>
  </g>
</svg>
