version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: construction
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ---------- optional services (not used by app code yet) ----------
  # Start with:  docker compose --profile infra-future up
  rabbitmq:
    image: rabbitmq:3-management
    profiles: ["infra-future"]
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:latest
    profiles: ["infra-future"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
